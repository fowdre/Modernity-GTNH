name: Manually Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        default: 2.9.X
      tag:
        description: Release tag
        required: true

  release:
    types: [created]

env:
  INCLUDE_PATHS: |
    assets/
    MyCTMLib.cfg
    pack.mcmeta
    pack.png
    README.md

  EXTERNAL_REPOS: |
    OutlinedOres-Modern=https://github.com/Ranzuu/OutlinedOres-Modern
    Just-Productive-Bees=https://github.com/DarkScorpyon/Just-Productive-Bees-
    Just-Forestry-Bees=https://github.com/DarkScorpyon/Just-Forestry-Bees-
    Medium-Large-Turbine=https://github.com/DarkScorpyon/Medium-Large-Turbine
    Modernity-GTNH-UI=https://github.com/ABKQPO/Modernity-GTNH-UI
    Modernity-GTNH-Dark-UI=https://github.com/ABKQPO/Modernity-GTNH-Dark-UI

jobs:
  package-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      BUILD_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.repository.default_branch }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_BRANCH }}
          fetch-depth: 0
          fetch-tags: true

      - name: Get short commit hash
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Get last two release tags from ABKQPO/MyCTMLib
        run: |
          response=$(curl -s "https://api.github.com/repos/ABKQPO/MyCTMLib/releases?per_page=2")
          tags=($(echo "$response" | jq -r '.[].tag_name'))
          echo "TAG1=${tags[0]}" >> $GITHUB_ENV
          echo "TAG2=${tags[1]}" >> $GITHUB_ENV

      - name: Build ZIP
        shell: bash
        run: |
          ZIP_NAME="Modernity-GTNH-${RELEASE_TAG}.zip"

          echo "Building branch: $BUILD_BRANCH"
          echo "Output: $ZIP_NAME"

          rm -rf zip-root
          mkdir zip-root

          for path in $INCLUDE_PATHS; do
            [ -e "$path" ] && cp -r --parents "$path" zip-root/
          done

          cd zip-root
          zip -r "../$ZIP_NAME" .
          cd ..

      - name: Download latest two MyCTMLib jars
        shell: bash
        run: |
          mkdir -p jars

          for TAG in "$TAG1" "$TAG2"; do
            URL="https://github.com/ABKQPO/MyCTMLib/releases/download/${TAG}/MyCTMLib-${TAG}.jar"
            curl -L "$URL" -o "jars/MyCTMLib-${TAG}.jar"
          done

      - name: Delete old release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || exit 0

          for asset in $(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'); do
            echo "Deleting $asset"
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes
          done

      - name: Upload files to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            *.zip
            jars/*.jar
